<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>High Power Hydroelectric System</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #080d14;
        color: #f0f6fc;
    }

    #scene-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .ui-container {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: calc(100% - 32px);
        max-width: 320px;
    }

    .power-btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        cursor: pointer;
        color: #ffffff;
        background: #22c55e;
        box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
        transition: all 0.2s ease;
    }

    .power-btn.closed {
        background: #ef4444;
        box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }

    .power-btn:active {
        transform: scale(0.97);
    }

    .instructions {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 0.75rem;
        color: #94a3b8;
        pointer-events: none;
        white-space: nowrap;
    }

    @media (max-width: 600px) {
        .ui-container {
            top: 12px;
        }

        .power-btn {
            padding: 12px 16px;
            font-size: 0.85rem;
        }

        .instructions {
            bottom: 10px;
            font-size: 0.65rem;
            padding: 5px 10px;
        }
    }
</style>
</head>
<body>

<div id="scene-container"></div>

<div class="ui-container">
    <button id="powerBtn" class="power-btn">OPEN VALVE (MAX POWER)</button>
</div>

<div class="instructions">
    Drag to rotate • Pinch/Scroll to zoom • Two-finger drag to pan
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Scene Setup
const container = document.getElementById("scene-container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080d14);
scene.fog = new THREE.FogExp2(0x080d14, 0.012);

// Camera Setup
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

function adjustCameraPosition() {
    if (window.innerWidth < 600) {
        camera.position.set(24, 16, 24);
    } else {
        camera.position.set(16, 11, 18);
    }
}
adjustCameraPosition();

// Renderer Setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(1, 1.5, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.01;
controls.minDistance = 6;
controls.maxDistance = 45;

// Scene Ambient & Directional Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
dirLight.position.set(12, 22, 14);
dirLight.castShadow = true;
scene.add(dirLight);

// HIGH OUTPUT BULB LIGHT
const bulbLight = new THREE.PointLight(0xfacc15, 0, 30);
bulbLight.position.set(5.5, 4.2, 0);
scene.add(bulbLight);

// Materials
const matConcrete = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0xc0caf5, metalness: 0.95, roughness: 0.15 });
const matBlade = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
const matGenerator = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.2 });
const matPole = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.9 });
const matGlass = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transmission: 0.9,
    opacity: 1,
    transparent: true,
    roughness: 0.05
});
const matFilament = new THREE.MeshStandardMaterial({
    color: 0x444444,
    emissive: 0x000000,
    emissiveIntensity: 0
});
const matHousingGlass = new THREE.MeshPhysicalMaterial({
    color: 0x94a3b8,
    transmission: 0.85,
    opacity: 0.55,
    transparent: true,
    roughness: 0.1
});
const matWater = new THREE.MeshPhysicalMaterial({
    color: 0x0284c7,
    transmission: 0.85,
    opacity: 0.9,
    transparent: true,
    roughness: 0.1,
    ior: 1.333
});

// Ground Base & Grid
const gridHelper = new THREE.GridHelper(32, 32, 0x38bdf8, 0x334155);
gridHelper.position.y = -0.01;
scene.add(gridHelper);

const ground = new THREE.Mesh(
    new THREE.CylinderGeometry(15, 15, 0.4, 64),
    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
);
ground.position.y = -0.21;
ground.receiveShadow = true;
scene.add(ground);

// 1. DAM & RESERVOIR
const damWall = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5.5, 5), matConcrete);
damWall.position.set(-5, 2.75, 0);
damWall.castShadow = true;
scene.add(damWall);

const resWater = new THREE.Mesh(new THREE.BoxGeometry(3.4, 4.8, 4.8), matWater);
resWater.position.set(-5, 2.5, 0);
scene.add(resWater);

// 2. PIPING SYSTEM
const pipeMain = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 3.2, 32, 1, true), matDarkMetal);
pipeMain.rotation.z = -Math.PI / 4;
pipeMain.position.set(-2.2, 2.4, 0);
scene.add(pipeMain);

const pipeBranch1 = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.8, 24, 1, true), matDarkMetal);
pipeBranch1.rotation.x = Math.PI / 6;
pipeBranch1.position.set(-0.8, 1.2, -1.1);
scene.add(pipeBranch1);

const pipeBranch2 = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.8, 24, 1, true), matDarkMetal);
pipeBranch2.rotation.x = -Math.PI / 6;
pipeBranch2.position.set(-0.8, 1.2, 1.1);
scene.add(pipeBranch2);

// 3. DUAL TURBINES
function createTurbineUnit(x, z) {
    const group = new THREE.Group();

    const housing = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.9, 32), matHousingGlass);
    housing.position.set(x, 0.5, z);
    group.add(housing);

    const runner = new THREE.Group();
    runner.position.set(x, 0.5, z);

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.7, 24), matSteel);
    runner.add(hub);

    for (let i = 0; i < 10; i++) {
        const angle = (i / 10) * Math.PI * 2;
        const bucketGroup = new THREE.Group();

        const bucketCup = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16, 0, Math.PI), matBlade);
        bucketCup.rotation.x = Math.PI / 2;
        bucketCup.position.set(0.6, 0, 0);
        bucketGroup.add(bucketCup);

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35), matSteel);
        stem.rotation.z = Math.PI / 2;
        stem.position.set(0.38, 0, 0);
        bucketGroup.add(stem);

        bucketGroup.rotation.y = angle;
        runner.add(bucketGroup);
    }
    group.add(runner);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 16), matSteel);
    shaft.position.set(x, 1.5, z);
    group.add(shaft);

    const gen = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 1.1, 32), matGenerator);
    gen.position.set(x, 2.7, z);
    group.add(gen);

    scene.add(group);
    return { runner, shaft };
}

const turbine1 = createTurbineUnit(0.3, -1.8);
const turbine2 = createTurbineUnit(0.3, 1.8);

// 4. CLEARLY VISIBLE LIGHT POLE AND GIANT BULB
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 4.5, 16), matPole);
pole.position.set(5.5, 2.25, 0);
pole.castShadow = true;
scene.add(pole);

const bulbGroup = new THREE.Group();
bulbGroup.position.set(5.5, 4.2, 0);

const bulbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.4, 16), matSteel);
bulbBase.position.y = 0.5;
bulbGroup.add(bulbBase);

const bulbGlass = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), matGlass);
bulbGlass.position.y = 0.1;
bulbGroup.add(bulbGlass);

const bulbFilament = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), matFilament);
bulbFilament.position.y = 0.1;
bulbGroup.add(bulbFilament);

scene.add(bulbGroup);

// 5. OVERHEAD POWER WIRES
const wireCurve1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.3, 3.2, -1.8),
    new THREE.Vector3(2.8, 3.8, -0.8),
    new THREE.Vector3(5.5, 4.7, 0)
]);
const wireGeo1 = new THREE.TubeGeometry(wireCurve1, 20, 0.03, 8, false);
scene.add(new THREE.Mesh(wireGeo1, matDarkMetal));

const wireCurve2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.3, 3.2, 1.8),
    new THREE.Vector3(2.8, 3.8, 0.8),
    new THREE.Vector3(5.5, 4.7, 0)
]);
const wireGeo2 = new THREE.TubeGeometry(wireCurve2, 20, 0.03, 8, false);
scene.add(new THREE.Mesh(wireGeo2, matDarkMetal));

// Water Particles
const waterParticleCount = 60;
const waterGeo = new THREE.SphereGeometry(0.08, 8, 8);
const waterMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.9 });

function createParticleSet(startPos, endPos) {
    const list = [];
    for (let i = 0; i < waterParticleCount; i++) {
        const p = new THREE.Mesh(waterGeo, waterMat);
        p.visible = false;
        scene.add(p);
        list.push({ mesh: p, progress: Math.random(), start: startPos, end: endPos });
    }
    return list;
}

const particles1 = createParticleSet(new THREE.Vector3(-3.2, 3.4, 0), new THREE.Vector3(0.3, 0.5, -1.8));
const particles2 = createParticleSet(new THREE.Vector3(-3.2, 3.4, 0), new THREE.Vector3(0.3, 0.5, 1.8));

// Electricity Particles along Wire
const elecParticleCount = 15;
const elecGeo = new THREE.SphereGeometry(0.06, 8, 8);
const elecMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

function createElecParticles(curve) {
    const list = [];
    for (let i = 0; i < elecParticleCount; i++) {
        const p = new THREE.Mesh(elecGeo, elecMat);
        p.visible = false;
        scene.add(p);
        list.push({ mesh: p, progress: Math.random(), curve });
    }
    return list;
}

const elecList1 = createElecParticles(wireCurve1);
const elecList2 = createElecParticles(wireCurve2);

// State Management
let isOpen = false;
let currentFlow = 0;

const powerBtn = document.getElementById("powerBtn");

powerBtn.addEventListener("click", () => {
    isOpen = !isOpen;
    if (isOpen) {
        powerBtn.textContent = "CLOSE VALVE";
        powerBtn.classList.add("closed");
    } else {
        powerBtn.textContent = "OPEN VALVE (MAX POWER)";
        powerBtn.classList.remove("closed");
    }
});

// Animation Loop
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    const targetFlow = isOpen ? 1 : 0;
    currentFlow += (targetFlow - currentFlow) * delta * 2.8;

    const rotationSpeed = currentFlow * 25;

    turbine1.runner.rotation.y += rotationSpeed * delta;
    turbine1.shaft.rotation.y += rotationSpeed * delta;

    turbine2.runner.rotation.y += rotationSpeed * delta;
    turbine2.shaft.rotation.y += rotationSpeed * delta;

    const updateParticles = (particleList) => {
        particleList.forEach(p => {
            if (currentFlow > 0.05) {
                p.mesh.visible = true;
                p.progress += delta * currentFlow * 2.0;
                if (p.progress > 1) p.progress = 0;

                p.mesh.position.lerpVectors(p.start, p.end, p.progress);
            } else {
                p.mesh.visible = false;
            }
        });
    };

    updateParticles(particles1);
    updateParticles(particles2);

    const updateElec = (elecList) => {
        elecList.forEach(p => {
            if (currentFlow > 0.1) {
                p.mesh.visible = true;
                p.progress += delta * currentFlow * 2.5;
                if (p.progress > 1) p.progress = 0;

                const pos = p.curve.getPoint(p.progress);
                p.mesh.position.copy(pos);
            } else {
                p.mesh.visible = false;
            }
        });
    };

    updateElec(elecList1);
    updateElec(elecList2);

    // Glowing Filament & High Wattage Light Emission
    matFilament.emissive.setHex(0xfacc15);
    matFilament.emissiveIntensity = currentFlow * 8.0;
    bulbLight.intensity = currentFlow * 28;

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    adjustCameraPosition();
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
